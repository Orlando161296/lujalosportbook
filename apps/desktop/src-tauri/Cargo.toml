[package]
name = "lujalo-sportsbook"
version = "0.1.0"
description = "Sistema de apuestas hípicas Lujalo — taquilla + pizarra pública"
edition = "2021"

# NOTA: no se pudo compilar en este sandbox (sin GTK/WebKit del sistema ni
# forma práctica de instalarlos aquí). Las versiones exactas de tauri/serde
# deben confirmarse contra `cargo add tauri@2` en la máquina real de
# desarrollo antes del primer build — esto es un punto de partida, no un
# Cargo.lock verificado.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
