[package]
name = "lujalo-sportsbook"
version = "0.1.0"
description = "Sistema de apuestas hípicas Lujalo — taquilla + pizarra pública"
edition = "2021"

# Las versiones quedan fijadas en Cargo.lock, que SÍ se versiona: el binario
# de la máquina que compila y el de la que clona salen de las mismas fuentes.
# Compilado y corriendo en Linux con tauri 2.11.5. En Windows hace falta el
# toolchain MSVC y los Build Tools de Visual Studio — ver el README.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
